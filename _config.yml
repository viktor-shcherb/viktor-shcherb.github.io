title: Viktor Shcherbakov
tagline: Machine Learning Research Engineer
description: >-
  Personal site of Viktor Shcherbakov — ML Research Engineer at EPFL's MLO group.
  Long-form notes on ML, software, and life in Switzerland as a non-EU graduate.
url: "https://vshcherbakov.com"
baseurl: ""
logo: /logos-flavicon/favicon-96x96.png
# Default Open Graph / Twitter card image for pages without an explicit `image:`.
# 1200x630 PNG so Twitter/LinkedIn unfurls don't letterbox a square logo.
image: /assets/images/og/og-default.png
author:
  name: Viktor Shcherbakov
  url: https://vshcherbakov.com/about/
github:
  username: viktor-shcherb
locale: en_US
timezone: "Europe/Zurich"
future: true          # tells Jekyll to publish posts dated in the future

# remove .html from the blog pages
permalink: /:year/:month/:day/:title/

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-avatar
# jekyll-feed removed — replaced by the custom feed.xml at the repo root
# so we can honour the per-post `hidden: true` flag.
sass:
  load_paths:
    - assets/css

collections:
  projects:
    output: true
    permalink: /projects/:path/
    sort_by: order

defaults:
  - scope:
      path: ""
    values:
      # Default Open Graph / Twitter card image used by jekyll-seo-tag.
      # Pages can override by setting `image:` in their own front matter.
      image: /assets/images/og/og-default.png
  - scope:
      path: ""
      type: projects
    values:
      layout: project

# Hide developer docs and tool config from the published site so they
# don't end up in /AGENTS/, /README/, etc. and pollute the sitemap.
exclude:
  - AGENTS.md
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - tsconfig.json
  - scripts/
  - src/
  - vendor/
  - node_modules/
  - .bundle/
  - .sass-cache/
  - .jekyll-cache/

feed:
  title: "Viktor Shcherbakov — Blog"
  description: "Long-form notes on ML, software, and the practical side of life and work in Switzerland."
  lang: en-US
  author_name: Viktor Shcherbakov
  author_url: https://vshcherbakov.com/about/
